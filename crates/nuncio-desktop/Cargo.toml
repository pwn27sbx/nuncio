[package]
name = "nuncio-desktop"
description = "GTK 4 + libadwaita desktop client for nuncio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nuncio-client = { path = "../nuncio-client" }
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# 1.4: the navigation split view, the toolbar view and breakpoints.
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
# Already in Cargo.lock (through glib): the worker's answers into the GLib main loop.
futures-channel = "0.3"

# GTK must run on the main thread, which libtest's harness does not give a test.
[[test]]
name = "smoke"
harness = false
