# Creates the daemon's data directory before nunciod starts.
#
# The daemon cannot create it itself: its unit runs under ProtectSystem=strict, which leaves the
# whole home read-only except the paths it names, and a path that does not exist yet is skipped
# with the `-` prefix the unit needs for every first run. Creating the directory here keeps the
# daemon's write budget to that one directory instead of widening it to all of ~/.local/share,
# where other applications' stores and ~/.local/share/applications live.
#
# Read by `systemd-tmpfiles --user`, which nunciod.service pulls in with Wants=/After=. Mode 0700:
# the store, the media cache and the exports are the user's alone. `d` never cleans it up; the
# directory stays after `nuncio purge` (the wipe empties it, nothing removes it).
#
# %h is the home directory: the same XDG_DATA_HOME assumption the unit documents.
d %h/.local/share/nuncio 0700 - - -
